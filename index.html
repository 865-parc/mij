    /* 1. Super Header: Extra bold and distinct */

    line-height: 1.1;

  /* 2. Bold Header: Strong but standard */
  h2 {

  }
  h3 {
    font-weight: 700;
    text-align: center;
    font-size: 1rem;

  /* 3. Regular Header: Normal weight, optimized for clarity */
  h4 {
    font-weight: 400; /* Regular weight */

  .circle-image {
    width: 200px;         /* Set a specific width */

  /* Center the table within its parent */
.table-container {
  display: flex;
  justify-content: center;
  padding: 20px;
}

.styled-table {
  border-collapse: collapse;
  margin: 25px 0;
  font-size: 0.9em;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-width: 400px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
  border-radius: 8px 8px 0 0;
  overflow: hidden; /* Ensures the rounded corners show */
}

/* Header Styling - Cyan/Green Gradient */
.styled-table thead tr {
  background: linear-gradient(135deg, #00adbc, #27ae60);
  color: #ffffff;
  text-align: left;
  font-weight: bold;
}

.styled-table th,
.styled-table td {
  padding: 12px 15px;
}

/* Zebra Striping & Borders */
.styled-table tbody tr {
  border-bottom: 1px solid #dddddd;
}

.styled-table tbody tr:nth-of-type(even) {
  background-color: #f3fbf9; /* Very light cyan-green tint */
}

.styled-table tbody tr:last-of-type {
  border-bottom: 3px solid #27ae60; /* Solid green bottom border */
}

/* Hover Effect */
.styled-table tbody tr:hover {
  background-color: #e8f8f5;
  color: #007c89; /* Darker cyan text on hover */
  transition: 0.3s;
}

/* Highlighted Row Style */
.styled-table tbody tr.active-row {
  font-weight: bold;
  color: #00adbc;
}
</style>
