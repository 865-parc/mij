<style>
    /* 1. Super Header: Extra bold and distinct */
  h1 {
    font-weight: 900;
    text-align: center;
    font-size: 3rem;
    text-transform: uppercase;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 0.5em;
    color: #1a1a1a;
  }
  
  /* 2. Bold Header: Strong but standard */
  h2 {
    font-weight: 700;
    text-align: center;
    font-size: 2rem;
    color: #333;
  }
  h3 {
    font-weight: 700;
    text-align: center;
    font-size: 1rem;
    color: #333;
  }
  
  /* 3. Regular Header: Normal weight, optimized for clarity */
  h4 {
    font-weight: 400; /* Regular weight */
    font-size: 1.5rem;
    line-height: 1.4;
    color: #555;
    border-left: 4px solid #ececec; /* Adds a clear visual marker */
    padding-left: 15px;
  }

  .circle-image {
    width: 200px;         /* Set a specific width */
    height: 200px;        /* Set the same height to make it a square */
    border-radius: 50%;   /* This turns the square into a circle */
    object-fit: cover;    /* Ensures the image doesn't look stretched */
  }


  .styled-table {
    border-collapse: collapse;
    margin: 25px 0;
    font-size: 0.9em;
    font-family: sans-serif;
    min-width: 400px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    border-radius: 5px 5px 0 0;
    overflow: hidden;
}

    .styled-table thead tr {
        background-color: #009879;
        color: #ffffff;
        text-align: left;
        font-weight: bold;
    }

    .styled-table th,
    .styled-table td {
        padding: 12px 15px;
    }

    .styled-table tbody tr {
        border-bottom: 1px solid #dddddd;
    }

    .styled-table tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
    }

    .styled-table tbody tr:last-of-type {
        border-bottom: 2px solid #009879;
    }

    .styled-table tbody tr.active-row {
        font-weight: bold;
        color: #009879;
    }

    /* Hover effect for better UX */
    .styled-table tbody tr:hover {
        background-color: #f1f1f1;
        cursor: pointer;
    }
</style>
